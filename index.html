<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101211"><meta name="description" content="目標・習慣・振り返りをひとつに。端末内だけで記録する成長管理アプリ。"><title>GROWTH OS</title><style>:root{color-scheme:dark;--bg:#101211;--card:#191c19;--line:#30362e;--gold:#d8c28e;--text:#f1f1e9;--muted:#a4ada0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 -apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif}button,input,select,textarea{font:inherit}button,a,label.import{-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit;background:transparent;border:1px solid var(--line);border-radius:12px;min-height:44px;padding:8px 15px}button:hover{border-color:var(--gold)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.shell{max-width:820px;margin:auto;padding:32px 26px 130px}header{display:flex;align-items:center;justify-content:space-between;padding-bottom:36px}.brand{color:var(--text);text-decoration:none;font-size:23px;font-weight:750;letter-spacing:2px}.brand span{color:var(--gold)}.brand small{display:block;font-size:10px;font-weight:400;letter-spacing:1px;color:var(--muted);margin-top:4px}.local{color:var(--gold);font-size:11px}h1{font-size:29px;line-height:1.35;font-weight:600;margin:10px 0}h2{font-size:17px;font-weight:600;margin:0}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gold);margin:0}.muted,.subtitle{color:var(--muted);font-size:13px}.subtitle{margin:8px 0 26px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:23px;margin-bottom:18px}.hero{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(115deg,#282e23,#191c19)}.hero strong{font-size:32px;font-weight:500}.ring{width:105px;height:105px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) var(--progress),#363c31 0)}.ring span{width:87px;height:87px;border-radius:50%;background:#20251e;display:grid;place-content:center;text-align:center;font-size:24px}.ring small{font-size:10px;color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 14px}.primary{background:var(--gold);color:#1c2018;border-color:var(--gold);font-weight:600}.empty{padding:27px 12px;text-align:center;color:var(--muted);font-size:14px}.task{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.check{flex-shrink:0;border-radius:50%;width:44px;padding:0;font-size:20px}.check[aria-pressed=true]{background:var(--gold);color:#1c2018;border-color:var(--gold)}.done .task-label{text-decoration:line-through;color:var(--muted)}.task-label{overflow-wrap:anywhere}.tag{font-size:10px;color:var(--gold);letter-spacing:1px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:22px}.day{text-align:center;font-size:11px;color:var(--muted)}.bar{height:70px;background:#252b23;border-radius:6px;display:flex;align-items:flex-end;overflow:hidden;margin:8px 0}.bar i{display:block;background:#aab68b;width:100%;min-height:0}.today{color:var(--gold)}.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.item-head h2{overflow-wrap:anywhere}.actions{display:flex;gap:8px;margin-top:18px}.actions button{font-size:12px}.history{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.history button{font-size:11px;padding:5px 8px}.history button[aria-pressed=true]{background:#394333;border-color:#aab68b}.history button:disabled{opacity:.4;cursor:default}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,820px);display:grid;grid-template-columns:repeat(4,1fr);background:#171b17f5;border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(20px);z-index:10}nav button{border:0;color:var(--muted);font-size:23px;padding:3px}nav span{display:block;font-size:10px}nav button[aria-current=page]{color:var(--gold);background:#282f23}label{display:block;font-size:13px;color:var(--muted);margin:18px 0}input,select,textarea{width:100%;display:block;background:#101410;border:1px solid #46503f;border-radius:10px;color:var(--text);font-size:16px;padding:12px;margin-top:8px}textarea{min-height:110px;resize:vertical}input[type=date]{min-height:48px}dialog{color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:20px;width:min(92%,480px);padding:25px;max-height:88dvh;overflow:auto}dialog::backdrop{background:#000b}.dialog-head{display:flex;align-items:center;justify-content:space-between}footer{text-align:center;font-size:11px;color:var(--muted);margin-top:34px}footer button,.import{display:inline-block;font-size:11px;margin:10px 5px 0;min-height:44px}.import{border:1px solid var(--line);border-radius:12px;padding:10px 15px;cursor:pointer}.import input{font-size:11px;max-width:180px}#notice{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--gold);color:#171c15;border-radius:10px;padding:10px 18px;z-index:30;max-width:90%;font-size:13px}#notice:empty{display:none}.review-status{color:var(--gold);font-size:12px}@media(max-width:480px){.shell{padding:24px 18px 120px}header{padding-bottom:30px}.brand{font-size:20px}.card{padding:19px}.week{gap:6px}h1{font-size:26px}.local{font-size:10px}.hero strong{font-size:27px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}}
</style></head>
<body><div class="shell"><header><a class="brand" href="#home">GROWTH<span> OS</span><small>自分のペースで、昨日の先へ。</small></a><span class="local">● 端末内保存</span></header><main id="main"></main><nav aria-label="メインナビゲーション"><button data-page="home">⌂<span>ホーム</span></button><button data-page="goals">◎<span>目標</span></button><button data-page="habits">✓<span>習慣</span></button><button data-page="review">✎<span>振り返り</span></button></nav><footer>小さな一歩が、未来をつくる。<button id="backup">記録を書き出す</button><label class="import">記録を復元<input type="file" id="restore" accept="application/json,.json"></label><p>記録はこのブラウザ内に保存されます。定期的に書き出しましょう。</p></footer></div><div id="notice" role="status" aria-live="polite"></div><dialog id="delete-dialog"><div class="dialog-head"><h2>項目を削除しますか？</h2></div><p class="muted">この項目と実行履歴が削除されます。この操作は取り消せません。</p><div class="actions"><button type="button" id="cancel-delete">キャンセル</button><button type="button" id="confirm-delete" class="primary">削除する</button></div></dialog><dialog id="editor"><form id="edit-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close" aria-label="閉じる">×</button></div><label>名前<input name="title" required maxlength="100" placeholder="例：英語を毎日学ぶ"></label><div id="goal-fields"><label>期間<select name="period"><option>長期</option><option>月間</option><option>週間</option></select></label><label>毎日の具体的な行動<input name="action" maxlength="150" placeholder="例：英単語を10個覚える" required></label><p class="muted">行動は毎日のタスクに表示されます。</p></div><button class="primary" type="submit">保存する</button></form></dialog><dialog id="backup-dialog"><div class="dialog-head"><h2>記録のバックアップ</h2><button type="button" id="backup-close" aria-label="閉じる">×</button></div><p class="muted">Kodoでダウンロードできない場合の代替方法です。下のJSONをすべてコピーし、iPhoneの「メモ」などに貼り付けて保存してください。個人の記録が含まれるので、公開しないでください。</p><textarea id="backup-text" readonly aria-label="バックアップJSON" style="min-height:230px;font-size:12px;line-height:1.4"></textarea><button type="button" class="primary" id="backup-copy">すべて選択してコピー</button></dialog><script>/* データ層：画面から独立させ、将来の分析機能を追加しやすくしています。 */
const Growth = (() => {
 const key='growth-os-v1';
 const date=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 const empty=()=>({version:1,goals:[],habits:[],reviews:{}});
 const id=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`;
 const valid=s=>s?.version===1&&Array.isArray(s.goals)&&Array.isArray(s.habits)&&s.reviews&&typeof s.reviews==='object'&&!Array.isArray(s.reviews)&&s.goals.every(g=>g&&typeof g.id==='string'&&typeof g.title==='string'&&typeof g.action==='string'&&['長期','月間','週間'].includes(g.period)&&Array.isArray(g.done)&&g.done.every(x=>typeof x==='string'))&&s.habits.every(h=>h&&typeof h.id==='string'&&typeof h.title==='string'&&Array.isArray(h.done)&&h.done.every(x=>typeof x==='string'))&&Object.values(s.reviews).every(r=>r&&['good','better','next'].every(k=>typeof r[k]==='string'));
 const load=storage=>{const raw=storage.getItem(key);if(!raw)return empty();const s=JSON.parse(raw);if(!valid(s))throw Error('保存データの形式が正しくありません');return s;};
 const save=(storage,s)=>storage.setItem(key,JSON.stringify(s));
 const toggle=(item,day)=>{item.done=item.done.includes(day)?item.done.filter(d=>d!==day):[...item.done,day];};
 const tasks=s=>[...s.goals.filter(g=>g.action.trim()).map(g=>({...g,label:g.action,kind:'goal'})),...s.habits.map(h=>({...h,label:h.title,kind:'habit'}))];
 const stats=(s,day)=>{const t=tasks(s),done=t.filter(t=>t.done.includes(day)).length;return{total:t.length,done,rate:t.length?Math.round(done/t.length*100):0};};
 const week=(now=new Date())=>{const d=new Date(now);d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return date(x);});};
 return{key,date,empty,id,valid,load,save,toggle,tasks,stats,week};
})();
if(typeof module!=='undefined')module.exports=Growth;
</script><script>/* 画面層：入力 → データ更新 → 保存 → 再表示、の順に動きます。 */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state,blocked=false,page='home',edit=null,reviewDay=Growth.date(),historyDay=Growth.date(),timer;
try{state=Growth.load(localStorage);}catch(e){state=Growth.empty();blocked=true;}
function notice(s){$('#notice').textContent=s;clearTimeout(timer);timer=setTimeout(()=>$('#notice').textContent='',5000);}
// 保存に失敗したら、変更前の状態を維持します。
function commit(fn){if(blocked){notice('保存データを読み込めません。書き出して保管後、正しいバックアップを復元してください。');return false;}const next=JSON.parse(JSON.stringify(state));fn(next);try{Growth.save(localStorage,next);state=next;return true;}catch{notice('保存できませんでした。空き容量・ブラウザの保存設定を確認してください。');return false;}}
function intro(en,title,sub){return `<p class="eyebrow">${en}</p><h1>${title}</h1><p class="subtitle">${sub}</p>`;}
function render(){const today=Growth.date();document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});let html='';
 if(page==='home'){const s=Growth.stats(state,today);html=intro('YOUR DAILY GROWTH','今日の一歩を、積み重ねる。',new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'long'}))+`<section class="card hero"><div><p class="eyebrow">TODAY’S PROGRESS</p><p><strong>${s.done}<span class="muted"> / ${s.total}</span></strong></p><span class="muted">${s.total?'いい一日は、小さな行動から。':'まずは目標や習慣を登録しましょう。'}</span></div><div class="ring" style="--progress:${s.rate}%"><span>${s.rate}%<small>達成率</small></span></div></section><div class="section-head"><h2>今日のタスク</h2><span class="muted">${s.total}件</span></div><section class="card">`;
 html+=Growth.tasks(state).map(t=>`<div class="task ${t.done.includes(today)?'done':''}"><button class="check" data-toggle="${t.kind}" data-id="${esc(t.id)}" data-day="${today}" aria-label="${esc(t.label)}" aria-pressed="${t.done.includes(today)}">${t.done.includes(today)?'✓':'＋'}</button><div><div class="tag">${t.kind==='goal'?'目標へのアクション':'毎日の習慣'}</div><div class="task-label">${esc(t.label)}</div></div></div>`).join('')||'<div class="empty">まだタスクがありません。<br>「目標」か「習慣」から、最初の一歩を。</div>';
 html+='</section><section class="card"><h2>今週の活動</h2><p class="muted">月曜日〜日曜日・各日の達成数</p><div class="week">'+Growth.week().map((d,i)=>{const v=Growth.stats(state,d);return `<div class="day ${d===today?'today':''}">${['月','火','水','木','金','土','日'][i]}<div class="bar"><i style="height:${d>today?0:v.rate}%"></i></div>${d>today?'—':v.done+'件'}</div>`;}).join('')+'</div><p class="muted">集計は現在登録されている行動・習慣が対象です。</p></section>';
 }else if(page==='goals'||page==='habits'){const goal=page==='goals',list=goal?state.goals:state.habits;html=intro(goal?'DESIGN YOUR FUTURE':'BUILD YOUR RHYTHM',goal?'目指す未来を、具体的に。':'小さな習慣、大きな変化。',goal?'長期・月間・週間の目標を、毎日の行動につなげよう。':'できた日にチェック。続けた記録が自信になる。')+`<div class="section-head"><h2>${goal?'目標':'習慣'}一覧</h2><button class="primary" data-add="${goal?'goal':'habit'}">＋ ${goal?'目標':'習慣'}を追加</button></div>`;
 if(!goal)html+=`<label>チェックする日<input id="history-day" type="date" value="${historyDay}" max="${today}"></label><p class="muted">日付を変えると、過去の日も記録できます。</p>`;
 html+=list.map(t=>`<article class="card"><div class="tag">${goal?esc(t.period):'DAILY HABIT'}</div><div class="item-head"><div><h2>${esc(t.title)}</h2>${goal?`<p class="muted">毎日の行動：${esc(t.action)}</p>`:''}</div>${!goal?`<button class="check" data-toggle="habit" data-id="${esc(t.id)}" data-day="${historyDay}" aria-label="${esc(t.title)}" aria-pressed="${t.done.includes(historyDay)}">${t.done.includes(historyDay)?'✓':'＋'}</button>`:''}</div>${!goal?`<p class="muted">実行日数：${t.done.length}日 ／ 今週の履歴</p><div class="history">${Growth.week().map(d=>`<button data-toggle="habit" data-id="${esc(t.id)}" data-day="${d}" ${d>today?'disabled':''} aria-label="${d}" aria-pressed="${t.done.includes(d)}">${d.slice(5)}${t.done.includes(d)?' ✓':''}</button>`).join('')}</div>`:''}<div class="actions"><button data-edit="${goal?'goal':'habit'}" data-id="${esc(t.id)}">編集</button><button data-delete="${goal?'goal':'habit'}" data-id="${esc(t.id)}">削除</button></div></article>`).join('')||'<div class="card empty">「追加」から登録してみましょう。</div>';
 }else{const r=state.reviews[reviewDay]||{good:'',better:'',next:''};html=intro('REFLECT & GROW','今日の経験を、明日の力に。','短い言葉で大丈夫。自分の変化を残そう。')+`<section class="card"><label>振り返る日<input id="review-day" type="date" max="${today}" value="${reviewDay}"></label><form id="review-form"><label>今日できたこと<textarea name="good" maxlength="5000" placeholder="小さなことでも、できた自分を認めよう。">${esc(r.good)}</textarea></label><label>改善したいこと<textarea name="better" maxlength="5000" placeholder="次はどうしたら、もっと良くなる？">${esc(r.better)}</textarea></label><label>明日取り組むこと<textarea name="next" maxlength="5000" placeholder="明日の自分に、一つだけ約束。">${esc(r.next)}</textarea></label><button class="primary">振り返りを保存</button><p class="review-status">${state.reviews[reviewDay]?'この日の記録を保存しています':'入力後に保存ボタンを押してください'}</p></form></section>`;}
 $('#main').innerHTML=(blocked?'<p role="alert" class="card">保存データを読み込めませんでした。元の記録を上書きしないため、保存を停止しています。</p>':'')+html;
}
function openEditor(kind,id){const item=id?state[kind==='goal'?'goals':'habits'].find(x=>x.id===id):null;edit={kind,id};$('#dialog-title').textContent=`${kind==='goal'?'目標':'習慣'}を${id?'編集':'追加'}`;const f=$('#edit-form');f.reset();f.elements.title.value=item?.title||'';f.elements.period.value=item?.period||'週間';f.elements.action.value=item?.action||'';$('#goal-fields').hidden=kind!=='goal';f.elements.action.required=kind==='goal';$('#editor').showModal();f.elements.title.focus();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.page){if(reviewDirty()){if(!confirm('未保存の振り返りがある可能性があります。移動しますか？'))return;}page=d.page;render();window.scrollTo(0,0);}if(d.add)openEditor(d.add);if(d.edit)openEditor(d.edit,d.id);if(d.delete){pendingDelete={kind:d.delete,id:d.id};$('#delete-dialog').showModal();}if(d.toggle&&d.day<=Growth.date()){if(commit(s=>{const item=s[d.toggle==='goal'?'goals':'habits'].find(x=>x.id===d.id);if(item)Growth.toggle(item,d.day);}))render();}});
let pendingDelete=null;$('#cancel-delete').onclick=()=>{$('#delete-dialog').close();pendingDelete=null;};$('#confirm-delete').onclick=()=>{if(!pendingDelete)return;const {kind,id}=pendingDelete;if(commit(s=>{const k=kind==='goal'?'goals':'habits';s[k]=s[k].filter(x=>x.id!==id);})){$('#delete-dialog').close();pendingDelete=null;render();notice('削除しました');}};$('#close').onclick=()=>$('#editor').close();
$('#edit-form').onsubmit=e=>{e.preventDefault();const f=e.target,title=f.elements.title.value.trim(),action=f.elements.action.value.trim();if(!title||(edit.kind==='goal'&&!action)){notice('空白だけでは登録できません。');return;}if(commit(s=>{const k=edit.kind==='goal'?'goals':'habits',old=s[k].find(x=>x.id===edit.id),item={id:old?.id||Growth.id(),title,done:old?.done||[]};if(edit.kind==='goal')Object.assign(item,{period:f.elements.period.value,action});if(old)s[k][s[k].indexOf(old)]=item;else s[k].push(item);})){ $('#editor').close();render();notice('保存しました');}};
document.addEventListener('submit',e=>{if(e.target.id!=='review-form')return;e.preventDefault();const f=new FormData(e.target);if(commit(s=>s.reviews[reviewDay]={good:f.get('good'),better:f.get('better'),next:f.get('next')})){render();notice('振り返りを保存しました');}});
document.addEventListener('change',e=>{if(['history-day','review-day'].includes(e.target.id)){const day=e.target.value;if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||day>Growth.date()){render();return;}if(e.target.id==='history-day')historyDay=day;else{if(reviewDirty()&&!confirm('未保存の内容を破棄して日付を変更しますか？')){e.target.value=reviewDay;return;}reviewDay=day;}render();}});
function reviewDirty(){if(page!=='review'||!$('#review-form'))return false;const f=new FormData($('#review-form')),r=state.reviews[reviewDay]||{};return ['good','better','next'].some(k=>f.get(k)!==(r[k]||''));}
window.addEventListener('beforeunload',e=>{if(reviewDirty()){e.preventDefault();e.returnValue='';}});
$('#backup').onclick=()=>{try{const raw=blocked?localStorage.getItem(Growth.key):JSON.stringify(state,null,2);if(!raw){notice('書き出せる記録がありません。');return;}const area=$('#backup-text');area.value=raw;$('#backup-dialog').showModal();}catch{notice('バックアップを表示できませんでした。');}};
$('#backup-close').onclick=()=>$('#backup-dialog').close();
$('#backup-copy').onclick=async()=>{const area=$('#backup-text');area.focus();area.select();try{if(!navigator.clipboard?.writeText)throw Error('clipboard unavailable');await navigator.clipboard.writeText(area.value);notice('コピーしました。「メモ」などに貼り付けて保存してください。');}catch{notice('自動コピーできない場合は、選択された文章を長押しして「コピー」を選んでください。');}};
$('#restore').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5000000)throw Error();const s=JSON.parse(await file.text());if(!Growth.valid(s))throw Error();if(!confirm('現在の記録を、ファイルの内容に置き換えますか？'))return;Growth.save(localStorage,s);state=s;blocked=false;render();notice('復元しました');}catch{notice('復元できません。ファイル形式や保存容量を確認してください。');}finally{e.target.value='';}};
window.addEventListener('hashchange',()=>{if(location.hash==='#home'){if(reviewDirty()&&!confirm('未保存の振り返りを破棄して移動しますか？'))return;page='home';render();}});
// 日付が変わったら、新しい日の表示へ更新します。未保存の振り返りは保護します。
let lastDay=Growth.date();setInterval(()=>{if(lastDay!==Growth.date()&&!reviewDirty()){lastDay=Growth.date();historyDay=lastDay;reviewDay=lastDay;render();}},30000);
render();
</script></body></html>
